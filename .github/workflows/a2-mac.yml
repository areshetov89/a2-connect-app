name: A2 Connect macOS

on:
  workflow_run:
    workflows: ["A2 Connect build"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: a2-mac
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15-intel
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android signing
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "no keystore secret"; exit 0; fi
          echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Disable Impeller on Intel macOS
        if: matrix.platform == 'macos' && matrix.arch == 'amd64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart setup.dart ${{ matrix.platform }} --env stable -v

      - name: List output
        shell: bash
        run: ls -la dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: a2-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./dist
          pattern: a2-*
          merge-multiple: true
      - name: Upload to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          f=$(ls dist | grep -E 'macos.*amd64.*\.dmg$' | head -1 || true)
          [ -n "$f" ] || { echo "no dmg"; exit 1; }
          cp "dist/$f" A2Connect-Mac-Intel.dmg
          tag=$(gh release list --repo "${{ github.repository }}" -L 1 --json tagName -q '.[0].tagName')
          gh release upload "$tag" A2Connect-Mac-Intel.dmg --clobber --repo "${{ github.repository }}"

name: A2 screens

on:
  push:
    branches: [main]
    paths: ['lib/views/a2_*.dart', 'test/a2/**', '.github/workflows/a2-screens.yml']
  workflow_dispatch:

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Fonts
        run: sudo apt-get install -y fonts-dejavu-core >/dev/null || true
      - run: flutter pub get
      - name: Render screens
        run: flutter test test/a2 --update-goldens
      - uses: actions/upload-artifact@v4
        with:
          name: a2-screens
          path: test/a2/goldens/*.png
